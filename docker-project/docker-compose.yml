services:
  # ── Database ───────────────────────────────────────────────────────────────
  db:
    # MariaDB 10.6.4 supports both AMD64 and ARM64
    image: mariadb:10.6.4-focal
    # Required for WordPress compatibility
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    # Persistent storage so data survives container restarts
    volumes:
      - db_data:/var/lib/mysql
    # All credentials come from the .env file — never hard-code them
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # Only expose MySQL on the internal network, not to the host
    expose:
      - "3306"
    networks:
      - app-net
    # Health check so WordPress waits until the DB is truly ready
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Application ────────────────────────────────────────────────────────────
  wordpress:
    image: wordpress:latest
    restart: always
    depends_on:
      db:
        # Wait for DB health check to pass before starting WordPress
        condition: service_healthy
    env_file:
      - .env
    environment:
      WORDPRESS_DB_HOST: db          # Resolved by Docker's internal DNS
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
    # WordPress is only reachable via the nginx reverse proxy
    expose:
      - "80"
    networks:
      - app-net

  # ── Reverse Proxy ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: always
    depends_on:
      - wordpress
    ports:
      # HTTP (redirect to HTTPS in production — see nginx/nginx.conf bonus section)
      - "80:80"
      # HTTPS (requires TLS certificate — see bonus challenge)
      - "443:443"
    volumes:
      # Mount custom Nginx config
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount TLS certs directory (needed for HTTPS bonus challenge)
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - app-net

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  # Named volume for MySQL data persistence
  db_data:

# ── Networks ───────────────────────────────────────────────────────────────
networks:
  # Isolated internal network — containers communicate by service name
  app-net:
    driver: bridge
